{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard | SvFinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

  <style>
    :root {
      --primary: #002147;
      --secondary: #0056b3;
      --accent: #ffc107;
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --subtext: #555;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to right, #f0f4ff, #e5ecff);
      color: #1e1e1e;
      overflow-x: hidden;
    }

    /* --- Navbar Styling --- */
   nav {
  background-color: #001c54;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 40px;
  height: 75px;
  box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo-section {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-img {
  height: 38px;
}

.logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.logo-main {
  font-size: 1.1rem;
  font-weight: 600;
  color: #FFD700;
}

.logo-sub {
  font-size: 0.7rem;
  color: #ddd;
  font-weight: 400;
}

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .dashboard-content {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .dashboard-content h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 40px;
      color: var(--primary);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transition: 0.3s ease;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .card i {
      font-size: 35px;
      color: var(--secondary);
      margin-bottom: 15px;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .card p {
      font-size: 15px;
      color: var(--subtext);
    }

    .card p strong {
      display: block;
      font-size: 1.6rem;
      color: var(--primary);
      margin-top: 5px;
    }

    .footer {
      margin-top: 60px;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--gray);
    }

    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        padding: 15px 20px;
      }

      .nav-links {
        flex-direction: column;
        gap: 15px;
        margin-top: 10px;
      }

      .dashboard-content h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo-section">
    <img src="{% static 'logoukm.png' %}" alt="UKM Logo" class="logo-img" />
    <div class="logo-text">
      <span class="logo-main">SvFinder</span>
      <span class="logo-sub">Fakulti Teknologi dan Sains Maklumat</span>
    </div>
  </div>

  <div class="nav-links">
    <a href="{% url 'studentlist' %}"></i> Students</a>
    <a href="{% url 'supervisorlist' %}"></i> Supervisors</a>
    <a href="{% url 'viewpermohonan' %}"></i> Reports</a>
    <a href="{% url 'index' %}"></i> Logout</a>
  </div>
</nav>

<div class="dashboard-content">
  <h1>Welcome, Admin!</h1>

  <div class="cards">
    <div class="card">
      <i class="fas fa-users"></i>
      <h3>Students</h3>
      <p><strong>{{ student_count }}</strong> registered</p>
    </div>
    <div class="card">
      <i class="fas fa-chalkboard-teacher"></i>
      <h3>Supervisors</h3>
      <p><strong>{{ supervisor_count }}</strong> available</p>
    </div>
    <div class="card">
      <i class="fas fa-file-alt"></i>
      <h3>Reports</h3>
      <p><strong>{{ report_count }}</strong> submitted</p>
    </div>
  </div>
</div>

</body>

</html>
