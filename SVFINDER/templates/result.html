{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Submit Result | SvFinder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="{% static 'logoukm.png' %}" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #001c54;
      --gold: #FFD700;
      --light-bg: #f5f8ff;
      --text-dark: #222;
      --gray: #777;
      --link-blue: #007bff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to right, #f0f4ff, #e5ecff);
      color: #1e1e1e;
      overflow-x: hidden;
    }


    nav {
  background-color: #001c54;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 40px;
  height: 75px;
  box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo-section {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-img {
  height: 38px;
}

.logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.logo-main {
  font-size: 1.1rem;
  font-weight: 600;
  color: #FFD700;
}

.logo-sub {
  font-size: 0.7rem;
  color: #ddd;
  font-weight: 400;
}


    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      margin-left: 20px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .container {
      max-width: 680px;
      margin: 60px auto;
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    h2 {
      text-align: center;
      font-size: 28px;
      font-family: 'Roboto Slab', serif;
      margin-bottom: 30px;
      color: var(--navy);
    }

    label {
      display: block;
      font-weight: 600;
      margin: 20px 0 6px;
      color: var(--navy);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fefefe;
      color: var(--gray);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .submit-btn {
      margin-top: 30px;
      padding: 12px 20px;
      background-color: var(--navy);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    .submit-btn:hover {
      background-color: #003377;
    }

    @media (max-width: 600px) {
      .container {
        margin: 30px 15px;
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo-section">
      <img src="{% static 'logoukm.png' %}" alt="UKM Logo" class="logo-img" />
      <div class="logo-text">
        <span class="logo-main">SvFinder</span>
        <span class="logo-sub">Fakulti Teknologi dan Sains Maklumat</span>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2>Submit Application Result</h2>
    <form method="POST">
      {% csrf_token %}

      <label>ID Status</label>
      <input type="text" name="id_status" value="S {{ permohonan.id_pelajar_id }}" readonly>

      <label>ID Permohonan</label>
      <input type="text" name="id_permohonan" value="{{ permohonan.id_permohonan }}" readonly>

      <label>Status</label>
      <select name="status" required>
        <option value="">-- Choose Status --</option>
        <option value="Accepted">Accepted</option>
        <option value="Rejected">Rejected</option>
      </select>

      <label>Ulasan</label>
      <textarea name="ulasan" maxlength="3000" required placeholder="Enter your remarks..."></textarea>

      <input type="hidden" name="tarikh_kemaskini_status" value="{{ today|date:'Y-m-d' }}">

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

</body>
</html>
